[package]
name = "km003c-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Graphical monitor for the ChargerLAB POWER-Z KM003C"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "KM003CWorkbench"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
km003c-lib = { workspace = true, features = ["usbpd"] }
eframe = { version = "0.35.0", features = ["persistence"] }
egui-system-fonts = "0.35.0"
egui_plot = "0.36.0"
polars = { version = "0.55.2", default-features = false, features = ["csv", "parquet"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
hex = "0.4.3"

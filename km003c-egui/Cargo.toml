[package]
name = "km003c-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Graphical monitor for the ChargerLAB POWER-Z KM003C"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "KM003CWorkbench"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
km003c-lib = { workspace = true, features = ["usbpd"] }
eframe = { version = "0.36.2", features = ["persistence"] }
egui_plot = "0.36.0"
polars = { version = "0.54.4", default-features = false, features = ["csv", "parquet"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# In-process NSProcessInfo activities for idle-sleep and App Nap protection.
# Both crates are already part of the macOS dependency graph through winit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
# Locating and mapping the Simplified Chinese system font (src/theme.rs). The
# memmap feature lets fontdb read face names without loading a ~60 MB file.
fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs", "memmap"] }
memmap2 = "0.9.11"
# Rejects faces whose outlines egui cannot draw; already in the graph through fontdb.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }

[dev-dependencies]
hex = "0.4.3"
